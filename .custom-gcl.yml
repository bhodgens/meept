# Build config for a custom golangci-lint binary that embeds the repo's
# analyzers as MODULE PLUGINS. Build with:
#
#   golangci-lint custom
#
# NO LONGER USED (2026-10-06, audit H2). `make lint` and CI no longer
# reference ./custom-gcl, and .golangci.yml carries no `custom:` section
# any more: a module plugin only loads inside a binary built this way, so
# registering one made the config unloadable by a stock golangci-lint and
# killed the entire gate. mutexio is enforced standalone instead (make
# mutexio / make analyzers / ci.yml / .githooks/pre-commit-mutexio).
# This file and tools/analyzers/mutexio/gclplugin are kept only as the
# recipe should the plugin route ever be wanted again; delete both
# together rather than re-adding a `custom:` entry to .golangci.yml.
version: v2.13.1
plugins:
  - module: github.com/caimlas/meept
    path: .
    import: github.com/caimlas/meept/tools/analyzers/mutexio/gclplugin
