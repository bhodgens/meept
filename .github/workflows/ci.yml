name: CI

# CI for the meept project. Runs on every push to main and every PR.
# Covers:
#   - Go build (daemon + CLI + tools)
#   - Go vet
#   - golangci-lint (with all linters from .golangci.yml)
#   - gosec security scan (G201 SQL injection, G202 string concatenation in SQL)
#   - Project analyzers (mutexio, predid)
#   - Python audit scripts (UTF-8 byte arithmetic, Dart enum shadowing)
#   - Go test with race detector (highest-risk packages only for speed)
#   - Full Go test without race detector
#   - Hermetic e2e tier (make e2e-fast: fake LLM, sandboxed MEEPT_HOME,
#     no live models; member of the ci-success aggregate gate)
#
# Adding a new analyzer: drop it under tools/analyzers/ and add a step below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Go: build + vet + lint + analyzers + audit scripts ──────────────
  go-static-analysis:
    name: Go static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # golangci-lint --new-from-rev needs the merge base with main,
          # which a shallow (default depth 1) clone does not have.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: Install cgo build deps (alsa headers for the oto audio driver)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint (build from source; prebuilt binaries lag the toolchain)
        # --new-from-rev: gates NEW findings only. Measured at ee0de064 with
        # the config-load bug fixed: a repo-wide `golangci-lint run ./...`
        # reports 13 issues, all from 565b0ef7, so the debt is ~13 findings,
        # not the ~1100 an earlier comment here claimed -- that number was
        # never verified and was the same comment that hid the dead gate
        # below. --new-from-rev is kept as the policy (block regressions
        # without failing on that debt); paydown of those 13 is separate.
        #
        # This step GATES. It used to end in `|| true`, which swallowed
        # every failure mode including a config that cannot be loaded --
        # so the gate read green while `golangci-lint run` was exiting 3
        # with `build linters: plugin(mutexio): plugin "mutexio" not
        # found` (audit H2/M3, .hermes/audits/2026-10-05-bughunt-wave.md).
        # No tolerant fallback here: --new-from-rev is what absorbs the
        # pre-existing debt, so a red step means a real regression or a
        # real tool/config error. Do not re-add `|| true`; if you need to
        # re-baseline after a deliberate bulk edit, fix forward instead.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          base=$(git merge-base origin/main HEAD)
          if [ -z "$base" ]; then
            echo "ERROR: could not resolve merge-base with origin/main (shallow clone?)." >&2
            exit 1
          fi
          echo "Gating new findings against ${base}"
          $(go env GOPATH)/bin/golangci-lint run --timeout=10m --new-from-rev="$base"

      # gofmt gate. Runs the SAME checker as `make fmt-check`
      # (scripts/fmt-check.sh), so the CI gate and the local target cannot
      # disagree about what "formatted" means. NOT `--new-from-rev`: unlike
      # the linter debt above, the tree is not gofmt-clean today, so this gate
      # is EXPECTED TO FAIL until the sweep lands. It is wired here so the
      # moment the tree is clean the check is permanently enforced. Fix the
      # offenders with `make fmt` in the sweep commit.
      - name: gofmt (make fmt-check)
        run: make fmt-check

      - name: gosec (G201, G202)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -include=G201,G202 ./...

      # Project analyzers — these enforce CLAUDE.md project rules.
      #   - mutexio: no I/O under mutex (CLAUDE.md "Mutex scope" rule)
      #   - predid:  no time.Now().UnixNano() used as unique ID
      #              (CLAUDE.md mandates pkg/id.Generate)
      - name: mutexio analyzer
        run: go run ./tools/analyzers/mutexio/ ./...

      - name: predid analyzer
        run: go run ./tools/analyzers/predid/ ./...

  # ─── Python audit scripts ─────────────────────────────────────────────
  python-audits:
    name: Python audit scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # UTF-8 byte arithmetic: flags hand-rolled ASCII case-conversion
      # (c |= 0x20, c += 'a' - 'A') that corrupts multi-byte UTF-8.
      - name: UTF-8 byte-arithmetic audit
        run: python3 scripts/audit-utf8-byte-arithmetic.py

      # Dart enum-name-shadow: flags Dart extensions that shadow
      # Enum.name/index (silent footgun that broke SearchScope.name).
      # Only runs if Flutter UI exists in the PR.
      - name: Dart enum-name-shadow audit
        run: |
          if [ -d ui/flutter_ui/lib ]; then
            python3 scripts/audit-dart-enum-name-shadow.py
          else
            echo "ui/flutter_ui/lib not present; skipping dart audit"
          fi

  # ─── Go tests (race detector, highest-risk packages) ─────────────────
  # Race detection is expensive; we run it only on packages with known
  # concurrency surface area. The full suite runs without -race below.
  go-test-race:
    name: Go tests (race, high-risk pkgs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      # Highest-risk packages: those with concurrent access patterns and
      # those that have been fixed in prior review rounds.
      #
      # internal/llm and internal/comm/http are slow under -race
      # (~90s and ~40s per iteration respectively) but historically
      # most race bugs cluster here, so the cost is justified.
      - name: Install cgo build deps (alsa headers for the oto audio driver)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: go test -race (high-risk packages)
        # -p 2 matches the canonical bounded invocation (see Makefile
        # TEST_PACKAGE_PARALLELISM): macOS full sweeps exhaust ephemeral
        # ports at go's default -p; bounding here keeps CI identical.
        run: |
          go test -race -count=1 -p 2 \
            ./internal/agent/... \
            ./internal/llm/... \
            ./internal/memory/... \
            ./internal/comm/http/... \
            ./internal/rpc/... \
            ./internal/queue/... \
            ./internal/task/... \
            ./internal/services/... \
            ./internal/security/... \
            ./internal/scheduler/... \
            ./internal/code/... \
            ./internal/pty/... \
            ./internal/tts/... \
            ./pkg/...

  # ─── Go tests (full suite, no race detector) ──────────────────────────
  go-test:
    name: Go tests (full)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: Install cgo build deps (alsa headers for the oto audio driver)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: go test (short)
        # -p 2 = canonical package-parallelism bound (Makefile
        # TEST_PACKAGE_PARALLELISM); see AGENTS.md Test section.
        run: go test -short -count=1 -p 2 ./...

  # ─── Setter nil-guard regression check ────────────────────────────────
  # Locks in the CLAUDE.md rule that every Set* method accepting a pointer
  # or interface must be nil-safe. Catches typed-nil panics.
  go-setter-tests:
    name: Setter nil-guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cgo build deps (alsa headers for the oto audio driver)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: Run setter nil-safety tests
        run: |
          go test -count=1 -run TestAllSetters \
            ./internal/agent/ \
            ./internal/services/ \
            ./internal/llm/ \
            ./internal/llm/metrics/ \
            ./internal/rpc/ \
            ./internal/queue/ \
            ./internal/security/ \
            ./internal/skills/ \
            ./internal/selfimprove/ \
            ./internal/comm/telegram/ \
            ./internal/daemon/ \
            ./internal/code/tools/ \
            ./internal/lint/ \
            ./internal/tools/builtin/

  # ─── pkg/id tests ─────────────────────────────────────────────────────
  # pkg/id is mandated by CLAUDE.md as the project's ID generator. Ensure
  # its uniqueness, format, and concurrency-safety contracts hold.
  pkg-id-tests:
    name: pkg/id tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cgo build deps (alsa headers for the oto audio driver)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: go test -race ./pkg/id/...
        run: go test -race -count=3 ./pkg/id/...

  # ─── Hermetic e2e tier (e2e/, build tag `e2e`) ─────────────────────────
  # The hermetic fast tier: fresh scratch binaries, sandboxed HOME and
  # MEEPT_HOME under $TMPDIR/meept-e2e-*, fake LLM (e2e/harness/fakellm.go).
  # No live model, no live daemon, no secrets, no host-state dependence.
  #
  # code-quality.yml also runs this tier (job `e2e-fast`), but that workflow
  # is not part of the ci-success aggregate gate below - a red suite there
  # never blocked a merge protected by "CI success". This job is the gate
  # member; the live-model tier (make e2e-chat) stays local-only by design.
  e2e-fast:
    name: E2E hermetic fast tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: Install cgo build deps (alsa headers for the oto audio driver)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: Run hermetic e2e suites (make e2e-fast)
        # The target already pins -count=1 (no cached results) and -p 2
        # (canonical package-parallelism bound). Full tier measured 13m04s
        # wall on a local 63-suite run (2026-10-25); 30 minutes leaves ~2x
        # headroom for the slower shared runner. Any red suite fails this
        # step via go test's exit code, and the job is a required member of
        # ci-success below.
        run: make e2e-fast

  # ─── deadcode reachability ratchet (unwired-code gate) ────────────────
  # Runs the same gate as pre-commit hook #20 (.githooks/pre-commit-deadcode)
  # over the WHOLE checked-out tree. Locally the hook diffs the git index;
  # on a fresh CI checkout the index is empty, so it would early-return
  # exit 0 and the ratchet would never fire. MEEPT_DEADCODE_FULL_TREE=1
  # skips that early-return and enforces both baselines
  # (.githooks/deadcode-baseline.txt for the -test pass,
  #  .githooks/deadcode-baseline-notest.txt for the no-test pass) against
  # every commit, so "implemented with tests but never wired" cannot merge.
  # The follow-on step refuses a rewritten (grown) allow-list. The reachability
  # gate cannot see that hole: --rebaseline makes the new lines "known".
  deadcode:
    name: deadcode reachability gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MEEPT_DEADCODE_FULL_TREE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Growth ratchet diffs against the PR base sha or the push parent.
          # A depth-1 checkout does not contain that commit.
          fetch-depth: 0

      - name: Set up Go
        # go-version-file pins go1.27.3 (the go.mod toolchain line); the
        # hook additionally re-pins GOTOOLCHAIN from go.mod for its
        # package-loading subprocesses.
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: Install cgo build deps (alsa headers for the oto audio driver)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: Install deadcode (pinned to the go.mod x/tools version)
        run: go install golang.org/x/tools/cmd/deadcode@v0.52.0

      - name: Run deadcode gate over the full tree
        # Fail-closed by design: the hook exits non-zero when the binary is
        # missing (CI=true path) or when any function is unreachable from
        # all five production mains yet absent from the matching baseline.
        run: bash .githooks/pre-commit-deadcode

      - name: Refuse deadcode baseline growth
        # No env skip. Label exception is pull_request only; push has none.
        # The script stays free of GitHub label logic so it can run locally.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ contains(github.event.pull_request.labels.*.name, 'deadcode-baseline-growth') }}" = "true" ]; then
              echo "human label deadcode-baseline-growth allowed growth"
              exit 0
            fi
            bash scripts/deadcode-baseline-growth-check.sh "${{ github.event.pull_request.base.sha }}"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "github.event.before is all zeros (new branch / first push); skipping baseline-growth check"
              exit 0
            fi
            bash scripts/deadcode-baseline-growth-check.sh "$before"
          fi

  # ─── Census-gate regression battery ───────────────────────────────────
  # Pins .githooks/pre-commit-e2e Mode 2 (new-package census) contract via
  # the fixture seams. Pure bash+python3+git: the seam path exits before
  # the affected-suite gate, so no Go toolchain is needed here.
  census-selftest:
    name: E2E census gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run census regression battery
        run: bash scripts/e2e-census-selftest.sh

  # ─── Aggregate gate ───────────────────────────────────────────────────
  # Required-status-check name for branch protection. Succeeds only when
  # every job above succeeds.
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs:
      - go-static-analysis
      - python-audits
      - go-test-race
      - go-test
      - go-setter-tests
      - pkg-id-tests
      - e2e-fast
      - deadcode
      - census-selftest
    steps:
      - name: Report success
        run: echo "All CI checks passed."
