name: Code Quality Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hooks:
    runs-on: ubuntu-latest
    name: Pre-commit Hooks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # The sub-hooks begin with `#!/usr/bin/env bash`, so they execute under
      # the runner's bash 5 (this used to fail at step [1/17] because
      # pre-commit-build/pre-commit-ascii/pre-commit-dart-format hard-coded
      # /opt/homebrew/bin/bash — audit F100).
      #
      # Scope: `git diff --cached` is EMPTY on a fresh checkout, so this job
      # verifies that the suite starts and runs to completion, not that the
      # pushed diff is clean. Diff-level enforcement is the local pre-commit
      # hook (and the per-check jobs in ci.yml). Do not read a green run here
      # as "the pushed files passed every hook".
      - name: Run pre-commit hooks
        run: |
          git config core.hooksPath .githooks
          .githooks/pre-commit

      # Parses every hook and shell script with bash -n: a syntax error added
      # to a hook fails here instead of surfacing on the next developer commit
      # (or, worse, only in the hook that no longer parses but exits 0).
      # Non-scripts (.githooks/README.md) and files without a bash shebang are
      # skipped.
      - name: Shell syntax check (.githooks, scripts)
        run: |
          fail=0
          checked=0
          for f in .githooks/* scripts/*.sh; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -qE '^#!/.*\bbash\b' || continue
            checked=$((checked + 1))
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n failed"
              fail=1
            fi
          done
          echo "Parsed $checked shell script(s)."
          [ "$fail" -eq 0 ] || exit 1

  generated-artifacts:
    runs-on: ubuntu-latest
    name: Generated Artifacts Freshness
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod declares the toolchain, so this job cannot drift from the
          # module's required Go version the way the pinned '1.23' jobs can.
          go-version-file: go.mod

      # docs/generated/* (bus topology, RPC handlers, HTTP routes, WSEvent
      # map): pure Python, no dependencies. Red until `make graphs` is run
      # after a bus/RPC/HTTP/WS surface change.
      - name: Connectivity graphs are fresh
        run: make graphs-check

      # docs/reference/generated/* (gomarkdoc pages): needs mage + gomarkdoc,
      # which nothing else in CI installed - which is why this check was
      # documented as a gate for months while nothing ran it.
      - name: Install docs tooling
        run: |
          go install github.com/magefile/mage@latest
          go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Reference docs are fresh
        run: make docs-check

      # The eval guards that gate every acceptance number had no pin and no
      # runner: a revert of the corpus/replay disjointness guard or of the
      # coverage floor broke nothing.
      #
      # eval_harness imports numpy at module level, so "no dependencies" is NOT
      # true here (the guard logic itself is stdlib, but the import is not
      # lazy). Install it explicitly instead of assuming the runner image has
      # it, or this gate fails for the wrong reason on a clean image.
      - name: Install self-test dependencies
        run: |
          python3 -m pip install --quiet numpy 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages numpy

      - name: Classifier-eval guard self-test
        run: make classifier-eval-selftest

      # The remap + hook-classification guards had no runner either: CI's
      # pre-commit job runs on a fresh checkout where `git diff --cached` is
      # empty, so the build hook's root-artifact classifier never executes,
      # and the e2e sandbox remapper has no caller outside a live run. This
      # step extracts both from source and drives them on synthetic inputs.
      - name: Classifier-eval hardening test (remap + hook classification)
        run: make classifier-eval-hardening-test

      - name: E2E sweep offline regression tests
        run: make e2e-sweep-selftest

  analyzers:
    runs-on: ubuntu-latest
    name: Static Analyzers
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Build mutexio analyzer
        run: go build -o bin/mutexio ./tools/analyzers/mutexio/

      - name: Build fieldguard analyzer
        run: go build -o bin/fieldguard ./tools/analyzers/fieldguard/

      - name: Install cgo build deps (alsa headers for the oto audio driver)
        # Linux-only CI runner dependency: oto's ALSA driver needs
        # libasound2-dev for `go build ./...` (export data for analyzers).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: Build module (cgo export data for analyzers)
        # x/tools-based analyzers load cgo deps (oto audio, tree-sitter,
        # sqlite-vec) from export data; without a prior build they fail
        # with "could not import C (no metadata for C)".
        run: go build ./...

      - name: Run mutexio
        # cgo must stay ON: internal/lint (tree-sitter) and
        # internal/memory/vector (sqlite-vec) exclude all Go files
        # without it.
        run: ./bin/mutexio ./...

      - name: Run fieldguard (non-blocking)
        run: ./bin/fieldguard ./... || true

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run gosec
        run: gosec -quiet ./...

  race-detector:
    runs-on: ubuntu-latest
    name: Race Detector
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Test with race detector
        run: go test -race -count=1 ./internal/cluster/ ./internal/queue/ ./internal/bus/

  runtime-instrumentation:
    runs-on: ubuntu-latest
    name: Runtime Instrumentation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Test with bus panic mode
        run: go test -run TestGossip_SubscriptionDrained ./internal/cluster/

  build:
    runs-on: ubuntu-latest
    name: Build Verification
    needs: [hooks, analyzers]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build daemon
        run: go build -o bin/meept-daemon ./cmd/meept-daemon

      - name: Build CLI
        run: go build -o bin/meept ./cmd/meept

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test ./... -v -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  e2e-fast:
    runs-on: ubuntu-latest
    name: E2E Fast (hermetic)
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # Hermetic Go e2e suites (e2e/): fresh binaries, sandboxed HOME/
      # MEEPT_HOME, fake LLM — no live daemon, no live model, no secrets.
      # The live-model tier (make e2e-chat) stays local-only by design.
      - name: Run hermetic e2e suites
        run: make e2e-fast
