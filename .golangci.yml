# golangci-lint configuration for meept
# https://golangci-lint.run/usage/configuration/
#
# NOTE: the "Found unknown linters in //nolint directives: mutexio,
# u1000" warning is expected and intentionally left in place — there is no
# config knob to allow-list custom nolint names (golangci-lint#1450).
# Registering these as golangci-lint plugins is NOT an option: a module
# plugin only loads inside a binary built by `golangci-lint custom`, so
# registering one makes this whole config unloadable by a stock
# golangci-lint (see the NOTE in linters.enable below). These directives
# are consumed by the repo's own tooling instead:
#   //nolint:mutexio -> tools/analyzers/mutexio (make analyzers, CI
#                      "mutexio analyzer" step, pre-commit hook [3/18])
#   //nolint:U1000   -> .githooks/pre-commit-u1000 (staticcheck U1000 gate)
# Do not remove them. The former //nolint:goerr113 directives were dead
# (no linter or hook consumed that name) and were removed 2026-09-30.
#
# Repo analyzers are enforced OUTSIDE golangci-lint, as standalone
# singlechecker binaries (tools/analyzers/*). A stock golangci-lint
# install is all this config needs; no `golangci-lint custom` build.
#   mutexio    -> make mutexio     (also: make analyzers, make lint-ci,
#                                   ci.yml "mutexio analyzer",
#                                   code-quality.yml "Run mutexio",
#                                   .githooks/pre-commit-mutexio [3/18])
#   predid     -> make predid      (also: make analyzers, make lint-ci,
#                                   ci.yml "predid analyzer")
#   fieldguard -> go run ./tools/analyzers/fieldguard/... (code-quality.yml)
#   selflock   -> go run ./tools/analyzers/selflock/...
# (verified 2026-10-06: the old `custom:` module-plugin registration made
# every stock golangci-lint run fail to load the config, so the plugin
# registration was removed and the standalone analyzer made the single
# enforcement point — H2 in .hermes/audits/2026-10-05-bughunt-wave.md.)
#
# Curated 2026-06-19 after a full audit (see docs/20260618-checkreview.md).
# The goal: enable linters that catch real bugs at acceptable noise; disable
# linters whose findings were overwhelmingly stylistic/cosmetic or have
# near-100% false-positive rates on this codebase. Run `make lint` to execute.

version: "2"

linters:
  enable:
    # Bugs & correctness
    - bodyclose          # HTTP response body closed
    # contextcheck disabled: near-100% false-positive rate for this codebase.
    # Daemon shutdown paths, bus handler goroutines, RPC cache/stats operations,
    # and scheduler operations all legitimately use context.Background().
    - copyloopvar        # Loop variable copies (Go 1.22+)
    - durationcheck      # Duration multiplication
    - errcheck           # Unchecked errors
    - errname            # Sentinel error naming (Err/FooError)
    - errorlint          # Error wrapping best practices
    - govet              # go vet passes
    - ineffassign        # Unused assignments
    - nilerr             # Returns nil despite checking err != nil
    - nilnesserr         # Returns wrong nil after err check
    - nilnil             # Returns nil error + nil value
    - rowserrcheck       # sql.Rows.Err checked
    - sqlclosecheck      # sql.Rows/Stmt closed
    - staticcheck        # Staticcheck rules (includes SA4023)
    - unused             # Unused code
    - wastedassign       # Wasted assignments

    # Security
    - gosec              # Security issues

    # Enforcement of enum-switch coverage (scoped): only switches carrying
    # an explicit //exhaustive:enforce comment are checked. The guarded
    # switch is wsclass.WSClass.String() (internal/comm/wsclass) - the
    # WS relay's event-type mapping. New WS-visible payload types must
    # implement WSClass(); new WSClass constants must extend every
    # enforced switch or CI fails. Repo-wide enablement was rejected:
    # 50 pre-existing non-enforced enum switches (tui, llm, code/ast)
    # would need unrelated churn (2026-09-17 baseline).
    - exhaustive         # Enum switch coverage (//exhaustive:enforce sites only)

    # Performance
    - unconvert          # Unnecessary type conversions

    # Style & readability (curated subset — disabled the noisy ones)
    - misspell           # Typos
    - sloglint           # Consistent slog usage

    # Modernization (kept enabled as a gate after the 2026-06-19 bulk cleanup)
    - intrange           # Use integer range in for loops
    - modernize          # Modern Go idioms

    # NOTE: the repo's own analyzers (mutexio, predid, fieldguard,
    # selflock) are NOT listed here and must not be. Registering one
    # under settings.custom with `type: module` makes .golangci.yml
    # unloadable by a plain `golangci-lint`: the plugin only exists
    # inside a bespoke binary built with `golangci-lint custom`
    # (44 MB, gitignored, and never built by CI or the pre-commit
    # chain), so the whole linter set dies with
    # `build linters: plugin(mutexio): plugin "mutexio" not found`.
    # They are enforced standalone instead — see the enforcement table
    # below and `make analyzers`.

    # DISABLED 2026-06-19 (see docs/20260618-checkreview.md for rationale):
    # - goconst     (712 findings, cosmetic; would force extracting every repeated string)
    # - gocritic    (307 findings, mostly stylistic; subset curated into other linters)
    # - prealloc    (15 findings, premature optimization; no measurable benefit)
    # - revive      (46 findings, opinionated; overlaps with staticcheck + govet)
    # - tagalign    (234 findings, pure formatting; not a real bug class)
    # - unparam     (74 findings, often false-positive on interface implementations)
    # - usestdlibvars (15 findings, cosmetic; replace with ad-hoc review)

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    paths:
      - "archive/.*"
      - "third_party/.*"
      - "testdata/.*"
      - "vendor/.*"
      - ".worktrees/.*"  # git worktrees hold parallel feature branches; never lint

  settings:
    exhaustive:
      # Scoped enforcement: only switches marked //exhaustive:enforce are
      # checked. See the linter-enable comment above for rationale.
      explicit-exhaustive-switch: true
    staticcheck:
      checks:
        - "all"
        - "SA4023"  # Impossible comparison: interface cannot be concrete type

    gosec:
      excludes:
        # G104 (errors unhandled) — overlaps with errcheck, and most findings
        # are intentional deferred-Close / HTTP-writer patterns. See
        # docs/20260618-checkreview.md for the policy rationale.
        - G104
        # G204 (subprocess launched with variable) — this is the project's
        # core feature (agent executes shell commands). Real control is the
        # Tirith pre-execution scanner + risk classifier + audit log.
        - G204
        # G304 (file path provided as taint input) — every config/skill/tool
        # loader triggers this. Real control is the project worktree fence
        # (pkg/security/permissions.go) and the security engine audit log.
        - G304
        # G301/G302/G306 (permission bits) — noisy; will be addressed in a
        # separate focused pass.
        - G301
        - G302
        - G306

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    sloglint:
      key-naming-case: snake
      args-on-sep-lines: false

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  fix: false

formatters:
  exclusions:
    paths:
      - "archive/.*"
      - "third_party/.*"
      - "testdata/.*"
      - "vendor/.*"
      - ".worktrees/.*"
